{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title mb-3">Login</h2>

        <form method="post">
          {% csrf_token %}
          {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors }}</div>
          {% endif %}

          <div class="mb-3">
            <label for="id_username" class="form-label">Username</label>
            <input
              type="text"
              name="username"
              autofocus
              autocapitalize="none"
              autocomplete="username"
              maxlength="150"
              required
              id="id_username"
              class="form-control"
            />
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Password</label>
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
              id="id_password"
              class="form-control"
            />
          </div>
          <button type="submit" class="btn w-100 login-acc-btn">Login</button>
        </form>
        <p class="mt-3 mb-0 text-center">
          Don't have an account? <a href="{% url 'signup' %}" class="signup-link">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
